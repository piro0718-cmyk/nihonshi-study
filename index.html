<style>

rong{font-family:Georgia,serif;font-size:27px;line-height:1.4;display:block}.stat span{font-size:11px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:23px;margin-bottom:18px}.section-label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:650;margin-bottom:13px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.mode{border:1px solid var(--line);background:transparent;border-radius:13px;padding:14px 12px;text-align:left;color:var(--ink)}.mode strong{display:block;font-size:14px}.mode small{font-size:11px;color:var(--muted)}.mode.active{border:2px solid var(--green);background:#f3edf5;padding:13px 11px}.mode:disabled{opacity:.45}.fields{display:grid;grid-template-columns:1fr 110px;gap:13px}.fields label{font-size:11px;font-weight:650;color:var(--muted);display:block}select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:#fffefa;border-radius:10px;min-height:45px;color:var(--ink);padding:8px;font-size:13px}.primary{display:block;width:100%;border:0;background:var(--green);color:#fff;border-radius:12px;padding:15px 18px;font-weight:650;margin-top:19px}.primary:disabled{opacity:.4}.secondary{display:block;width:100%;border:1px solid var(--line);color:var(--ink);background:transparent;border-radius:12px;padding:13px 18px;font-weight:600;margin-top:10px}.tiny{font-size:11px;color:var(--muted);line-height:1.8}.chapters{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:15px}.chapter{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:12px;background:#fffefa50}.chapter:last-child{border:0}.chapter span:last-child{white-space:nowrap;color:var(--muted);font-size:11px}.chapter b{color:var(--green)}details{margin:18px 0;font-size:12px;color:var(--muted)}summary{cursor:pointer;font-weight:650}.resume{border-color:#b9b1d4;background:#f0edf6}.re <script id="question-data" type="application/json">[{"id": "jp001", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "ノートでは、日本の混乱期の始まりとして挙げられている1467年の出来事は？", "options": ["応仁の乱", "桶狭間の戦い", "本能寺の変", "関ヶ原の戦い"], "explanation": "1467年の応仁の乱以降、日本は混乱期に入ったとあります。"}, {"id": "jp002", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "応仁の乱が起きた年は？", "options": ["1467年", "1543年", "1549年", "1560年"], "explanation": "ノートでは1467年と書かれています。"}, {"id": "jp003", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "戦国時代の室町幕府の状態として、ノートにあるのは？", "options": ["存在していても機能していない", "日本全国を直接支配していた", "江戸に政治の中心を移していた", "貿易許可証の朱印状を発行していた"], "explanation": "室町幕府は存在するものの、機能していない状態とあります。"}, {"id": "jp004", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "1543年にポルトガル船が漂着した場所は？", "options": ["種子島", "豊後", "長崎", "平戸"], "explanation": "種子島へのポルトガル船漂着によって鉄砲が伝来しました。"}, {"id": "jp005", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "1543年のポルトガル船の漂着で、日本に伝わったものは？", "options": ["鉄砲", "キリスト教", "参勤交代", "太閤検地"], "explanation": "ノートでは1543年を鉄砲伝来の年としています。"}, {"id": "jp006", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "鉄砲が日本に伝来した年は？", "options": ["1543年", "1549年", "1582年", "1600年"], "explanation": "1543年、種子島にポルトガル船が漂着し、鉄砲が伝来しました。"}, {"id": "jp007", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "1549年に来日したイエズス会の人物は？", "options": ["フランシスコ・ザビエル", "ウィリアム・アダムス", "ヤン・ヨーステン", "伊東マンショ"], "explanation": "ノートには1549年、イエズス会のフランシスコ・ザビエル来日とあります。"}, {"id": "jp008", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "ザビエルが来日した1549年に、日本へ伝わった宗教は？", "options": ["キリスト教", "浄土真宗", "天台宗", "仏教"], "explanation": "ノートの下部にも1549年、キリスト教伝来とまとめられています。"}, {"id": "jp009", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "スペイン・ポルトガルとの貿易を何という？", "options": ["南蛮貿易", "朱印船貿易", "西廻り航路", "東廻り航路"], "explanation": "スペイン・ポルトガルとの貿易を南蛮貿易と呼びます。"}, {"id": "jp010", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "南蛮貿易の相手として挙げられている国の組み合わせは？", "options": ["スペイン・ポルトガル", "イギリス・オランダ", "スペイン・オランダ", "ポルトガル , "q": "天正遣欧使節が派遣された年は？", "options": ["1582年", "1543年", "1549年", "1603年"], "explanation": "ノートには1582年とあり、本能寺の変と同年と書き添えられています。"}, {"id": "jp021", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "天正遣欧使節の4名の組み合わせは？", "options": ["伊東マンショ・千々石ミゲル・中浦ジュリアン・原マルチノ", "伊東マンショ・ザビエル・中浦ジュリアン・原マルチノ", "千々石ミゲル・ザビエル・ヤン・ヨーステン・原マルチノ", "伊東マンショ・千々石ミゲル・中浦ジュリアン・ウィリアム・アダムス"], "explanation": "ノートには、この4人の名前が列挙されています。"}, {"id": "jp022", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "応仁の乱後の「下剋上」の説明に合うのは？", "options": ["力のある者が上に立つ", "徳川の親戚だけが大名になる", "将軍職が世襲される", "天皇が学問に専念する"], "explanation": "室町幕府の形骸化から、力のある者が上に立つ下剋上の機運が生まれたとあります。"}, {"id": "jp023", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "戦国大名が領国支配のために制定したものは？", "options": ["分国法", "武家諸法度", "禁中並公家諸法度", "禁教令"], "explanation": "戦国大名は領国を支配するために分国法を制定したとあります。"}, {"id": "jp024", "chapter": "ヨーロッパとの接触と戦国時代", "source": "IMG_0528", "q": "分国法の目的として、ノートにある組み合わせは？", "options": ["家臣の統制・治安維持", "刀の輸出・銀の輸入", "参勤交代・将軍職の世襲", "布教の禁止・寺請け制度の創設"], "explanation": "ノートでは分国法の制定を、家臣の統制・治安維持につなげています。"}, {"id": "jp025", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "織田信長は、どこの戦国大名だった？", "options": ["尾張（愛知）", "駿河", "近江", "越前"], "explanation": "ノートの冒頭に、尾張（愛知）の戦国大名とあります。"}, {"id": "jp026", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "織田信長が掲げた「天下布武」とは？", "options": ["武力による天下統一", "貿易によるキリスト教の拡大", "天皇による全国の直接支配", "農民による自治の拡大"], "explanation": "天下布武について、武力による天下統一を掲げると説明されています。"}, {"id": "jp027", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "1560年、信長が今川義元を破った戦いは？", "options": ["桶狭間の戦い", "姉川の戦い", "長篠の戦い", "賤ヶ岳の戦い"], "explanation": "桶狭間の戦いで、駿河の今川義元を破ったとあります。"}, {"id": "jp028", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "桶狭間の戦いが起きた年は？", "options": ["1560年", "1568年", "1570年", "1575年"], "explanation": "ノートでは1560年、桶狭間の戦いとあります。"}, {"id": "jp029", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "桶狭間の戦いで信長に敗れた、駿河の大名は？", "options": ["今川義元", "武田氏", "浅井氏", "朝倉氏"], "explanation": "駿河の今川義元を破ると書かれています。"}, {"id": "jp030", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "1568年、信長が奉じて入京した人物は？", "options": ["足利義昭", "徳川家康", "豊臣秀頼", "柴田勝家"], "explanation": "足利義昭を奉じて入京し、第15代将軍に就任させたとあります。"}, {"id": "jp031", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "信長によって将軍に就任した足利義昭は、第何代将軍？", "options": ["第15代", "第2代", "第3代", "初代"], "explanation": "ノートでは第15代将軍と書かれています。"}, {"id": "jp032", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "1570年の姉川の戦いで、信長が破った連合は？", "options": ["浅井氏・朝倉氏", "織田氏・徳川氏", "今川氏・武田氏", "石田三成・豊臣秀頼"], "explanation": "近江の浅井氏と越前の朝倉氏の連合を破ったとあります。"}, {"id": "jp033", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "姉川の戦いで信長と戦った大名の地域の組み合わせは？", "options": ["浅井氏＝近江／朝倉氏＝越前", "浅井氏＝越前／朝倉氏＝近江", "浅井氏＝尾張／朝倉氏＝駿河", "浅井氏＝豊後／朝倉氏＝肥前"], "explanation": "ノートには近江の浅井氏、越前の朝倉氏とあります。"}, {"id": "jp034", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "浅井氏のもとに嫁いでいた、信長の妹は？", "options": ["お市", "淀", "ねね", "天草四郎"], "explanation": "ノートには浅井氏は信長の妹お市の嫁ぎ先とあります。"}, {"id": "jp035", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "1570年から始まる石山戦争で、信長が対立した相手は？", "options": ["一向宗（浄土真宗）", "天台宗", "イエズス会", "幕府の譜代大名"], "explanation": "一向宗（浄土真宗）と対立し、その拠点が石山とあります。"}, {"id": "jp036", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "1571年、信長が焼き討ちした天台宗の総本山は？", "options": ["比叡山延暦寺", "石山本願寺", "南蛮寺", "方広寺"], "explanation": "ノートには比叡山延暦寺焼き討ち、天台宗の総本山とあります。"}, {"id": "jp037", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "1573年、信長が足利義昭を追放したことで起きた変化は？", "options": ["室町幕府の滅亡", "江戸幕府の成立", "天下統一の達成", "鎖国の完成"], "explanation": "ノートでは足利義昭の追放を室町幕府の滅亡と結びつけています。"}, {"id": "jp038", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "室町幕府が滅亡した年として、ノートにあるのは？", "options": ["1573年", "1568年", "1582年", "1603年"], "explanation": "1573年、足利義昭を追放、室町幕府の滅亡とあります。"}, {"id": "jp039", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "1575年、織田・徳川連合が武田の騎馬隊を破った戦いは？", "options": ["長篠の戦い", "桶狭間の戦い", "姉川の戦い", "山崎の戦い"], "explanation": "ノートでは長篠の戦いでの勝利として書かれています。"}, {"id": "jp040", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "長篠の戦いで、織田・徳川連合が活用したものは？", "options": ["足軽鉄砲隊", "北前船", "五人組", "村方三役"], "explanation": "足軽鉄砲隊で武田の騎馬隊を撃破したとあります。"}, {"id": "jp041", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "1576年に信長が築いた城は？", "options": ["安土城", "大坂城", "小田原城", "石山本願寺"], "explanation": "ノートには1576年、安土城の築城とあります。"}, {"id": "jp042", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "信長が家臣団を居住させた場所は？", "options": ["城下", "江戸だけ", "宿場町の旅籠だけ", "アジアの日本町だけ"], "explanation": "安土城の説明に続き、城下に家臣団を居住させるとあります。"}, {"id": "jp043", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "信長が城下で行った商業政策は？", "options": ["楽市楽座", "太閤検地", "刀狩", "参勤交代"], "explanation": "城下では楽市楽座を実施したとあります。"}, {"id": "jp044", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "楽市楽座で、座に入っていない商人はどうなった？", "options": ["自由に商売できた", "商売を一切禁じられた", "年貢を納めるためだけに働いた", "必ず江戸に移住させられた"], "explanation": "市にかける税を免除し、座に入っていない者も自由に商売できるとあります。"}, {"id": "jp045", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "ノートで「座」は、どのように説明されている？", "options": ["同業組合", "将軍の親戚", "村の連帯責任組織", "身分の高い人の宿泊施設"], "explanation": "座の横に同業組合と書き添えられています。"}, {"id": "jp046", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "関所の撤廃によって発達したものは？", "options": ["商売・交通網", "参勤交代", "農民の武装", "朝廷の政治参加"], "explanation": "ノートでは関所を撤廃し、商売・交通網の発達へとつなげています。"}, {"id": "jp047", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "1582年、信長が部下に背かれて自刃した事件は？", "options": ["本能寺の変", "方広寺鐘銘事件", "サンフェリペ号事件", "島原・天草一揆"], "explanation": "ノートの末尾に、本能寺の変による信長の死とあります。"}, {"id": "jp048", "chapter": "織田信長の統一事業", "source": "IMG_0529", "q": "本能寺の変で信長に背いた部下は？", "options": ["明智光秀", "柴田勝家", "今川義元", "石田三成"], "explanation": "明智光秀に背かれ、自刃したと書かれています。"}, {"id": "jp049", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "1582年、秀吉が明智光秀を倒した戦いは？", "options": ["山崎の戦い", "賤ヶ岳の戦い", "関ヶ原の戦い", "長篠の戦い"], "explanation": "山崎の戦いで光秀を倒し、信長の後継者としての地位を確立したとあります。"}, {"id": "jp050", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "秀吉が山崎の戦いに向けて、毛利氏と和睦し急いで帰京したことを何という？", "options": ["中国大返し", "参勤交代", "国替え", "大政奉還"], "explanation": "ノートには、戦闘中の毛利氏と和睦して急遽帰京、中国大返しとあります。"}, {"id": "jp051", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "山崎の戦いの勝利で、秀吉が確立した地位は？", "options": ["信長の後継者としての地位", "室町幕府第15代将軍の地位", "江戸幕府第2代将軍の地位", "天台宗の総本山の地位"], "explanation": "明智光秀を倒して、信長の後継者としての地位を確立しました。"}, {"id": "jp052", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "1583年、秀吉が柴田勝家を破った戦いは？", "options": ["賤ヶ岳の戦い", "桶狭間の戦い", "姉川の戦い", "大坂の陣"], "explanation": "ノートには1583年、賤ヶ岳の戦い、柴田勝家をやぶるとあります。"}, {"id": "jp053", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "秀吉が大坂城を築いた場所は？", "options": ["石山本願寺跡地", "比叡山延暦寺跡地", "安土城跡地", "小田原城跡地"], "explanation": "大坂城築城、石山本願寺跡地にと書かれています。"}, {"id": "jp054", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "1585年、秀吉が就任し、その後太政大臣へ進んだ役職は？", "options": ["関白", "征夷大将軍", "京都所司代", "村方三役"], "explanation": "ノートには1585年、秀吉は関白に就任し、のち太政大臣へとあります。"}, {"id": "jp055", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "秀吉が全国の戦国武将に戦闘停止を命じた命令は？", "options": ["惣無事令", "バテレン追放令", "禁教令", "武家諸法度"], "explanation": "天皇から全国の支配権を委ねられたとして、戦国武将に戦闘停止を命じたとあります。"}, {"id": "jp056", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "惣無事令の説明として合うのは？", "options": ["戦国武将に戦闘停止を命じる", "武士だけに海外渡航を命じる", "大名の妻子を江戸に住まわせる", "農民に銃を持たせる"], "explanation": "ノートでは、天皇から全国の支配権を委ねられたとして出した命令と説明しています。"}, {"id": "jp057", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "1590年、秀吉が攻めた城は？", "options": ["小田原城", "安土城", "大坂城", "本能寺"], "explanation": "小田原城を攻め、抵抗する北条氏を倒したとあります。"}, {"id": "jp058", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "小田原城攻めで秀吉に倒され、天下統一につながった大名は？", "options": ["北条氏", "浅井氏", "朝倉氏", "今川氏"], "explanation": "ノートでは1590年、北条氏を倒して天下統一事業が完成したとあります。"}, {"id": "jp059", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "秀吉による天下統一が達成された年は？", "options": ["1590年", "1582年", "1600年", "1603年"], "explanation": "小田原城攻めの1590年が天下統一の達成としてまとめられています。"}, {"id": "jp060", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "1588年、秀吉が農民から武器を取り上げた政策は？", "options": ["刀狩", "太閤検地", "楽市楽座", "参勤交代"], "explanation": "ノートには1588年、刀狩とあります。"}, {"id": "jp061", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "刀狩で武器を取り上げた実際の目的として、ノートにあるのは？", "options": ["農民一揆を防止するため", "朝鮮出兵の船を増やすため", "寺の学問を奨励するため", "商人の座を増やすため"], "explanation": "農民一揆の防止のために武器を取り上げるとあります。"}, {"id": "jp062", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "刀狩の表向きの理由は？", "options": ["方広寺の大仏建立のため", "安土城の築城のため", "平戸の商館の建設のため", "天正遣欧使節の派遣のため"], "explanation": "ノートには、表向きは方広寺の大仏建立のためとあります。"}, {"id": "jp063", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "刀狩が進めることになった、武士と農民を分ける動きは？", "options": ["兵農分離", "天下布武", "下剋上", "鎖国"], "explanation": "刀狩の記述から、兵農分離へと矢印が引かれています。"}, {"id": "jp064", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "土地の生産力を米の取れ高で表すため、秀吉が実施した政策は？", "options": ["太閤検地", "楽市楽座", "武家諸法度", "バテレン追放令"], "explanation": "太閤検地では、土地の生産力を米の取れ高で表しました。"}, {"id": "jp065", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "太閤検地で、土地の生産力を換算したものは？", "options": ["石高", "座", "分国法", "朱印状"], "explanation": "ノートには、土地の生産力を米の取れ高「石高」で換算とあります。"}, {"id": "jp066", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "ノートで米一石に相当するとある量は？", "options": ["米150kg", "米75kg", "米100kg", "米300kg"], "explanation": "米一石＝米150kgで、成人男子が一年に消費する量と書き添えられています。"}, {"id": "jp067", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "太閤検地で、納入が義務づけられた年貢の基準は？", "options": ["石高", "商人の人数", "参勤交代の回数", "輸入した鉄砲の数"], "explanation": "石高に応じた年貢の納入を義務づけるとあります。"}, {"id": "jp068", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "太閤検地の「一地一作人」の原則で、年貢納入の責任を負ったのは？", "options": ["耕作者", "南蛮船の船員", "京都所司代", "イエズス会"], "explanation": "一地一作人の原則＝耕作者が年貢納入の責任を負うとあります。"}, {"id": "jp069", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "太閤検地と一地一作人の原則は、何の消滅につながった？", "options": ["荘園制度", "江戸幕府", "御三家", "五街道"], "explanation": "ノートでは、この政策を荘園制度の消滅につなげています。"}, {"id": "jp070", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "1592年、秀吉が行った朝鮮侵略は？", "options": ["文禄の役", "慶長の役", "大坂の冬の陣", "島原・天草一揆"], "explanation": "最初の出兵が1592年の文禄の役です。"}, {"id": "jp071", "chapter": "豊臣秀吉の統一と政策", "source": "IMG_0530", "q": "1597年、秀吉が行った2度目の朝鮮侵略は？", "options": [" 船・菱垣廻船・樽廻船", "北前船・リーフデ号・朱印状", "菱垣廻船・サンフェリペ号・本陣", "樽廻船・リーフデ号・旅籠"], "explanation": "ノートの海運の欄には、この3つの船の名称があります。"}, {"id": "jp124", "chapter": "武士・朝廷の統制と交通", "source": "IMG_0532", "q": "1615年、天皇・公家が守るべき規則として定められたのは？", "options": ["禁中並公家諸法度", "武家諸法度", "分国法", "禁教令"], "explanation": "朝廷への統制の欄に1615年、禁中並公家諸法度とあります。"}, {"id": "jp125", "chapter": "武士・朝廷の統制と交通", "source": "IMG_0532", "q": "禁中並公家諸法度で、天皇が励むべきだとされたことは？", "options": ["学問", "貿易", "軍事訓練", "領地拡大"], "explanation": "天皇は学問に励まねばならないとあり、政治への関心を排除すると整理されています。"}, {"id": "jp126", "chapter": "武士・朝廷の統制と交通", "source": "IMG_0532", "q": "朝廷を監視するために設置された役職は？", "options": ["京都所司代", "村方三役", "関白", "大御所"], "explanation": "ノートの末尾に京都所司代の設置、朝廷の監視とあります。"}, {"id": "jp127", "chapter": "農民の統制と秀吉の禁教政策", "source": "IMG_0533", "q": "土地を所有する農民を何と呼ぶ？", "options": ["本百姓", "浪人", "紅毛人", "親藩"], "explanation": "農民への統制の冒頭に、土地を所有する農民＝本百姓とあります。"}, {"id": "jp128", "chapter": "農民の統制と秀吉の禁教政策", "source": "IMG_0533", "q": "年貢納入や治安維持について、連帯責任を負うしくみは？", "options": ["五人組", "御三家", "イエズス会", "座"], "explanation": "ノートには年貢納入や治安維持で連帯責任を負う五人組とあります。"}, {"id": "jp129", "chapter": "農民の統制と秀吉の禁教政策", "source": "IMG_0533", "q": "村の運営にあたる村役人を何と呼ぶ？", "options": ["村方三役", "御三家", "五街道", "譜代大名"], "explanation": "ノートでは村運営にあたる村役人＝村方三役とあります。"}, {"id": "jp130", "chapter": "農民の統制と秀吉の禁教政策", "source": "IMG_0533", "q": "村方三役の組み合わせは？", "options": ["名主・組頭・百姓代", "名主・大御所・百姓代", "組頭・京都所司代・本百姓", "親藩・譜代大名・外様大名"], "explanation": "ノートでは村方三役（名主、組頭、百姓代）とあります。"}, {"id": "jp131", "chapter": "農民の統制と秀吉の禁教政策", "source": "IMG_0533", "q": "村法・村掟に違反したとき、ノートの例にある制裁は？", "options": ["村八分", "参勤交代", "転封", "兵農分離"], "explanation": "違反すると制裁、例として村八分が挙げられています。"}, {"id": "jp132", "chapter": "農民の統制と秀吉の禁教政策", "source": "IMG_0533", "q": "村八分でも、交際禁止の例外とされたものは？", "options": ["火事と葬式", "年貢と参勤交代", "学問と貿易", "刀狩と検地"], "explanation": "火事と葬式以外の交際禁止＝村八分とあります。"}, {"id": "jp133", "chapter": "農民の統制と秀吉の禁教政策", "source": "IMG_0533", "q": "信長は南蛮貿易をどのように扱った？", "options": ["奨励した", "全面的に禁止した", "オランダだけに限定した", "朱印船だけに限定した"], "explanation": "鎖国への hapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "島原・天草一揆の首領は？", "options": ["天草四郎（益田時貞）", "大友宗麟", "明智光秀", "徳川家光"], "explanation": "ノートには首領、天草四郎（益田時貞）とあります。"}, {"id": "jp164", "chapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "島原・天草一揆の反乱軍と幕府軍の人数の組み合わせは？", "options": ["反乱軍3万・幕府軍12万", "反乱軍12万・幕府軍3万", "反乱軍70万・幕府軍12万", "反乱軍3万・幕府軍70万"], "explanation": "ノートには反乱軍3万vs幕府軍12万とあります。"}, {"id": "jp165", "chapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "島原・天草一揆の鎮圧にかかった期間は？", "options": ["4か月", "1年おき", "264年", "26年"], "explanation": "ノートには4か月かけて鎮圧とあります。"}, {"id": "jp166", "chapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "隠れキリシタンを発見するために行われたことは？", "options": ["絵踏", "参勤交代", "太閤検地", "楽市楽座"], "explanation": "ノートには隠れキリシタン発見のために絵踏を実施とあります。"}, {"id": "jp167", "chapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "ノートで、改宗を強制する取り締まりとして挙げられているのは？", "options": ["宗門改め", "刀狩", "分国法", "楽市楽座"], "explanation": "絵踏に続いて、改宗を強制する宗門改めと書かれています。"}, {"id": "jp168", "chapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "仏教徒であることを寺に証明させるしくみは？", "options": ["寺請け制度", "幕藩体制", "荘園制度", "兵農分離"], "explanation": "ノートには、仏教徒であることを寺に証明させる寺請け制度の創設とあります。"}, {"id": "jp169", "chapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "1639年に来航を禁止された国の船は？", "options": ["ポルトガル船", "オランダ船", "イギリス船", "朱印船すべて"], "explanation": "ノートの末尾付近に1639年、ポルトガル船の来航禁止とあります。"}, {"id": "jp170", "chapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "1641年に出島へ移されたものは？", "options": ["オランダ商館", "イギリス商館", "南蛮寺", "京都所司代"], "explanation": "ノートには1641年、オランダ商館を出島に移すとあります。"}, {"id": "jp171", "chapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "ノートでは、鎖国の完成と結びつけられている出来事は？", "options": ["1641年のオランダ商館の出島移転", "1600年のリーフデ号漂着", "1549年のザビエル来日", "1582年の天正遣欧使節派遣"], "explanation": "オランダ商館の出島移転の横に「鎖国の完成」とあります。"}, {"id": "jp172", "chapter": "家康の貿易政策と鎖国への歩み", "source": "IMG_0534", "q": "鎖国への歩みを古い順に並べたものは？", "options": ["バテレン追放令→幕府領の禁教令→ポルトガル船来航禁止→オランダ商館の出島移転", "幕府領の禁教令→バテレン追放令→ポルトガル船来航禁止→オランダ商館の出島移転", "バテレン追放令→ポルトガル船来航禁止→幕府領の禁教令→オランダ商館の出島移転", "バテレン追放令→幕府領の禁教令→オランダ商館の出島移転→ポルトガル船来航禁止"], "explanation": "ノートの年号では1587年→1612年→1639年→1641年の順です。"}]</script>
<script>
'use strict';
const QUESTIONS=JSON.parse(document.getElementById('question-data').textContent);
const KEY='japanese-history-notes-20261021-v1',app=document.getElementById('app');
const chapters=[...new Set(QUESTIONS.map(q=>q.chapter))];
const lookup=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
let state={records:{},active:null},mode='all',topic='all',limit='10',storageOK=true;
function validActive(a){return a&&Array.isArray(a.items)&&a.items.length>0&&Number.isInteger(a.index)&&a.index>=0&&a.index<=a.items.length&&Array.isArray(a.answers)&&a.answers.length===(a.index+(a.selected!==null?1:0))&&a.items.every(x=>lookup[x.id]&&Array.isArray(x.order)&&x.order.length===4&&[...x.order].sort().join(',')==='0,1,2,3')&&(a.selected===null||(Number.isInteger(a.selected)&&a.selected>=0&&a.selected<4));}
function cleanRecords(records){const out={};if(!records||typeof records!=='object')return out;for(const q of QUESTIONS){let r=records[q.id];if(r&&typeof r==='object'&&typeof r.wrong==='boolean'&&Number.isInteger(r.seen)&&r.seen>0&&Number.isInteger(r.correct)&&r.correct>=0&&r.correct<=r.seen)out[q.id]={wrong:r.wrong,seen:r.seen,correct:r.correct};}return out;}
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw){state.records=cleanRecords(raw.records);state.active=validActive(raw.active)?raw.active:null;}localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function wrongIds(){return QUESTIONS.filter(q=>state.records[q.id]?.wrong).map(q=>q.id);}
function matches(q){return topic==='all'||q.chapter===topic;}
function pool(){return QUESTIONS.filter(q=>matches(q)&&(mode==='wrong'?state.records[q.id]?.wrong:mode==='unseen'?!state.records[q.id]:true));}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function notice(){return storageOK?'':'<p class="notice">このブラウザでは履歴を保存できません。記録を残すには「履歴のバックアップ」を使ってください。</p>';}
function home(){const seen=Object.keys(state.records).length,wrong=wrongIds().length,learned=seen-wrong;
app.innerHTML=`<section class="hero"><span class="eyebrow">JAPANESE HISTORY / NOTE 01—07</span><h1>ノートの知識を、<br>自分のものに。</h1><p class="intro">鉄砲伝来から天下統一、江戸幕府と鎖国まで。<br>7枚のノートだけでつくった、172問の4択。</p><span class="tag">1回10問から · 解説付き</span></section>${notice()}
<div class="stats"><div class="stat"><strong>${seen}<small style="font-size:12px"> / 172</small></strong><span>解いた問題</span></div><div class="stat"><strong>${learned}</strong><span>直近で正解</span></div><div class="stat"><strong style="color:var(--orange)">${wrong}</strong><span>復習する問題</span></div></div>
${state.active&&state.active.index<state.active.items.length?`<section class="card resume"><h2>途中から続けられます</h2><p class="tiny">${state.active.index+1} / ${state.active.items.length}問目まで進んでいます。</p><button id="resume" class="primary" style="margin-top:10px">続きから解く →</button></section>`:''}
<section class="card"><h2>今日はどこを復習する？</h2><div class="modes"><button class="mode ${mode==='all'?'active':''}" data-mode="all" aria-pressed="${mode==='all'}"><strong>すべてから</strong><small>ランダムに出題</small></button><button class="mode ${mode==='wrong'?'active':''}" data-mode="wrong" aria-pressed="${mode==='wrong'}"><strong>間違えた問題だけ</strong><small>正解したら復習リストから外す</small></button><button class="mode ${mode==='unseen'?'active':''}" data-mode="unseen" aria-pressed="${mode==='unseen'}"><strong>まだ解いていない問題</strong><small>ノートの範囲をひと通り</small></button><button class="mode ${mode==='full'?'active':''}" data-mode="full" aria-pressed="${mode==='full'}"><strong>分野をひと通り</strong><small>選んだ範囲を全問</small></button></div>
<div class="fields"><label>出題する分野<select id="topic"><option value="all">すべての分野</option>${chapters.map(c=>`<option value="${esc(c)}" ${topic===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>1回の問題数<select id="limit" ${mode==='full'?'disabled':''}>${['10','20','all'].map(n=>`<option value="${n}" ${limit===n?'selected':''}>${n==='all'?'全問':n+'問'}</option>`).join('')}</select></label></div><p id="poolInfo" class="tiny"></p><button id="start" class="primary">トレーニングを始める →</button></section>
<p class="section-label">7つの分野 / 全172問</p><div class="chapters">${chapters.map((c,i)=>{const qs=QUESTIONS.filter(q=>q.chapter===c),n=qs.filter(q=>state.records[q.id]&&!state.records[q.id].wrong).length;return `<div class="chapter"><span><b>0${i+1}</b>　${esc(c)}</span><span>${n} / ${qs.length} 正解</span></div>`;}).join('')}</div>
<details><summary>ノートの範囲・復習のしくみ</summary><p>出典：IMG_0528〜0534の7枚。最初の添付画像IMG_0527は世界史の続きのため除外しました。写真の中心の各ページを読み、ノートの人物・用語・作品・年号・因果関係から出題しました。写真の端で切れている隣ページや、判読が確実でない書き込みは含めていません。外部資料は加えていません。</p><p>間違えた問題を記録し、以後のトレーニングで正解すると復習リストから外します。再び間違えたら、もう一度リストに入ります。選択肢と問題の順番は毎回変わります。</p><p>履歴は同じ端末・同じブラウザ・同じサイト内に保存されます。別の端末とは自動同期されません。ブラウザのデータ削除やプライベート閲覧では履歴が失われることがあります。</p></details>
<details><summary>履歴のバックアップ・読み込み</summary><p>機種やブラウザを変えるときは、履歴を書き出して移せます。</p><button id="export" class="secondary">履歴をバックアップ</button><label class="file-label" for="import">バックアップを読み込む</label><input id="import" type="file" accept=".json,application/json"><p class="tiny">読み込むと、現在の履歴と途中のトレーニングを置き換えます。</p></details><details><summary class="danger">学習履歴をリセット</summary><button id="reset" class="secondary danger">全履歴を削除する</button></details><footer>JAPANESE HISTORY NOTE · 2026.10<br>少しずつ、間違いを減らそう。</footer>`;
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;home();});document.getElementById('topic').onchange=e=>{topic=e.target.value;updatePool();};document.getElementById('limit').onchange=e=>{limit=e.target.value;updatePool();};document.getElementById('start').onclick=start;
document.getElementById('resume')?.addEventListener('click',()=>{question();scrollTop();});
document.getElementById('reset').onclick=()=>{if(confirm('学習履歴と途中のトレーニングをすべて削除しますか？')){state={records:{},active:null};save();home();}};
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:KEY,records:state.records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='japanese-history-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!==KEY||!data.records||typeof data.records!=='object')throw Error();const records=cleanRecords(data.records);if(confirm('バックアップの履歴で、現在の学習履歴を置き換えますか？')){state={records,active:null};save();home();}}catch(e){alert('この教材のバックアップファイルを選んでください。');}};updatePool();}
function updatePool(){const n=pool().length,k=mode==='full'||limit==='all'?n:Math.min(Number(limit),n);document.getElementById('poolInfo').textContent=n?`対象 ${n}問から、${k}問を出題します。`:mode==='wrong'?'この範囲に間違えた問題はありません。':mode==='unseen'?'この範囲はすべて解いています。':'この範囲の問題はありません。';document.getElementById('start').disabled=!n;}
function start(){let qs=shuffle(pool());if(!qs.length)return;if(mode!=='full'&&limit!=='all')qs=qs.slice(0,Number(limit));if(state.active&&state.active.index<state.active.items.length&&!confirm('途中のトレーニングを終了し、新しく始めますか？ 学習履歴は残ります。'))return;
state.active={items:qs.map(q=>({id:q.id,order:shuffle([0,1,2,3])})),index:0,answers:[],selected:null,mode};save();question();scrollTop();}
function question(){const a=state.active;if(!a)return home();if(a.index>=a.items.length)return results();const item=a.items[a.index],q=lookup[item.id],answered=a.selected!==null;app.innerHTML=`<div class="qtop"><span>${esc(q.chapter)}</span><span>${a.index+1} / ${a.items.length}問</span></div><div class="progress"><i style="width:${a.index/a.items.length*100}%"></i></div><section class="card qcard"><p class="qnumber">QUESTION ${String(a.index+1).padStart(2,'0')} ${a.mode==='wrong'?'<span class="hint-chip">間違い復習</span>':''}</p><h2 class="question" tabindex="-1">${esc(q.q)}</h2><div class="choices">${item.order.map((opt,i)=>`<button class="choice ${answered?(opt===0?'correct':a.selected===i?'wrong':'faded'):''}" data-i="${i}" ${answered?'disabled':''}><span class="letter">${answered&&opt===0?'✓':'ABCD'[i]}</span><span>${esc(q.options[opt])}</span></button>`).join('')}</div>${answered?`<div class="feedback ${item.order[a.selected]===0?'':'miss'}" role="status"><strong>${item.order[a.selected]===0?'正解！':'正解は '+ 'ABCD'[item.order.indexOf(0)]+' です'}</strong><p>${esc(q.explanation)}</p><p class="tiny">${item.order[a.selected]===0?'この問題は復習リストに残りません。':'「間違えた問題だけ」に記録しました。'}</p><div class="source">出典：${esc(q.source)} · ${q.id.toUpperCase()}</div></div><button id="next" class="primary">${a.index+1===a.items.length?'今回の結果を見る':'次の問題へ →'}</button>`:'<p class="tiny" style="margin-top:17px">答えを1つ選んでください。</p>'}</section>${notice()}<p class="tiny" style="text-align:center">${answered?'回答と履歴を記録しました。':'ホームに戻っても、続きから再開できます。'}</p>`;
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));document.getElementById('next')?.addEventListener('click',()=>{a.index++;a.selected=null;save();question();scrollTop();});}
function answer(i){let a=state.active;if(!a||a.selected!==null)return;const item=a.items[a.index];const correct=item.order[i]===0;a.selected=i;a.answers.push({id:item.id,correct});const r=state.records[item.id]||{seen:0,correct:0,wrong:false};r.seen++;r.correct+=correct?1:0;r.wrong=!correct;state.records[item.id]=r;save();question();document.getElementById('next')?.focus({preventScroll:true});}
function results(){const a=state.active,good=a.answers.filter(x=>x.correct).length,miss=a.answers.filter(x=>!x.correct),wrong=wrongIds().length;app.innerHTML=`<section class="result"><span class="eyebrow">SESSION COMPLETE</span><h1>おつかれさま。</h1><div class="score">${good}<small> / ${a.items.length}</small></div><p class="muted">${good===a.items.length?'全問正解！ この調子で進もう。':'間違いは、次に覚えるための目印。'}</p></section><section class="card"><h2>${miss.length?'今回の間違いは '+miss.length+'問':'今回の問題はすべて正解'}</h2><p class="tiny">全範囲の復習リスト：${wrong}問。<br>復習で正解できた問題は、リストから外れます。</p>${wrong?'<button id="retry" class="primary">間違えた問題だけ復習する →</button>':'<p class="empty">復習リストは空です。よくがんばりました。</p>'}<button id="back" class="secondary">ホームに戻る</button></section>${miss.length?`<section class="card"><h2>今回の振り返り</h2>${miss.map(x=>{const q=lookup[x.id];return `<div class="reviewrow"><strong>${esc(q.q)}</strong><p style="color:var(--green)">正解：${esc(q.options[0])}</p><p class="tiny">${esc(q.explanation)}</p><div class="source">${esc(q.source)} · ${q.id.toUpperCase()}</div></div>`;}).join('')}</section>`:''}`;document.getElementById('back').onclick=()=>{home();scrollTop();};document.getElementById('retry')?.addEventListener('click',()=>{mode='wrong';topic='all';limit='all';start();});}
document.getElementById('homeBtn').onclick=()=>{home();scrollTop();};home();
</script>
</body></html>
